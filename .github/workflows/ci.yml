# Pull requests: project gate, then a PR-tagged image on Docker Hub (same-repo PRs only); cleanup when the PR closes.
# Local copy for now; the image part is to be extracted into zbitmanis/ci-workflows (follow-up task, docs/ci/README.md).
name: ci
"on":
  pull_request:
    types: [opened, synchronize, reopened, closed]

permissions:
  contents: read

jobs:
  gate:
    if: github.event.action != 'closed'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6   # TODO pin by SHA
      - uses: actions/setup-python@v6   # TODO pin by SHA
        with:
          python-version-file: .python-version
      - run: pip install -r requirements-dev.txt
      - run: ruff check . && ruff format --check .
      - run: mypy src tests
      - run: pip-audit -r requirements.txt
      - run: python scripts/check_licenses.py   # allowlist; homematicip is the documented exception
      - if: hashFiles('tests/**/*.py') != ''
        run: pytest -q

  build:
    needs: gate
    if: github.event.action != 'closed'
    runs-on: ubuntu-latest
    env:
      SAME_REPO: ${{ github.event.pull_request.head.repo.full_name == github.repository }}
    steps:
      - uses: actions/checkout@v6   # TODO pin by SHA
        with:
          fetch-depth: 0   # need tags and history to derive the next version
      - uses: docker/setup-qemu-action@v3      # TODO pin by SHA
      - uses: docker/setup-buildx-action@v3    # TODO pin by SHA
      - if: env.SAME_REPO == 'true'
        uses: docker/login-action@v3           # TODO pin by SHA
        with:
          username: ${{ vars.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}
      - name: Compute PR tags (next version from Conventional Commits since the last release tag)
        id: tags
        env:
          PR_NUMBER: ${{ github.event.pull_request.number }}
          REPO: ${{ vars.DOCKERHUB_USERNAME }}/${{ vars.DOCKERHUB_REGISTRY }}
        run: |
          last=$(git describe --tags --abbrev=0 --match 'v[0-9]*' --exclude 'v*-*' 2>/dev/null || true)
          if [ -n "$last" ]; then range="${last}..HEAD"; else range="HEAD"; fi
          msgs=$(git log --format='%s%n%b%n--END--' $range)
          bump=none
          if   grep -qE '^[a-z]+(\([^)]*\))?!:|^BREAKING[ -]CHANGE' <<<"$msgs"; then bump=major
          elif grep -qE '^feat(\([^)]*\))?:' <<<"$msgs"; then bump=minor
          elif grep -qE '^(fix|perf)(\([^)]*\))?:' <<<"$msgs"; then bump=patch; fi
          if [ -z "$last" ]; then
            base=0.0.0; [ "$bump" != none ] && next=1.0.0 || next=0.0.0   # semantic-release starts at 1.0.0
          else
            base=${last#v}; IFS=. read -r ma mi pa <<<"$base"
            case $bump in
              major) next="$((ma+1)).0.0" ;;
              minor) next="${ma}.$((mi+1)).0" ;;
              patch) next="${ma}.${mi}.$((pa+1))" ;;
              none)  next="$base" ;;
            esac
          fi
          sha=$(git rev-parse --short=7 "${{ github.event.pull_request.head.sha }}")
          tags="${REPO}:v${next}-pr.${PR_NUMBER}.${sha}"$'\n'"${REPO}:pr-${PR_NUMBER}"
          echo "bump=$bump last=${last:-none} next=$next"
          { echo "tags<<EOF"; echo "$tags"; echo "EOF"; } >> "$GITHUB_OUTPUT"
      - uses: docker/build-push-action@v6      # TODO pin by SHA
        with:
          context: .
          file: Dockerfile
          platforms: linux/amd64,linux/arm64
          push: ${{ env.SAME_REPO == 'true' }}
          tags: ${{ steps.tags.outputs.tags }}
          labels: |
            org.opencontainers.image.licenses=MIT AND GPL-3.0-or-later
            org.opencontainers.image.source=${{ github.server_url }}/${{ github.repository }}
            org.opencontainers.image.revision=${{ github.sha }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

  cleanup:
    if: github.event.action == 'closed' && github.event.pull_request.head.repo.full_name == github.repository
    runs-on: ubuntu-latest
    steps:
      - name: Delete pr-<n> tags from Docker Hub   # token needs Read/Write/Delete scope
        env:
          HUB_USER: ${{ vars.DOCKERHUB_USERNAME }}
          HUB_REPO: ${{ vars.DOCKERHUB_REGISTRY }}
          HUB_TOKEN: ${{ secrets.DOCKERHUB_TOKEN }}
          PR_NUMBER: ${{ github.event.pull_request.number }}
        run: |
          jwt=$(curl -fsS -H 'Content-Type: application/json' \
            -d "$(jq -n --arg u "$HUB_USER" --arg p "$HUB_TOKEN" '{username:$u,password:$p}')" \
            https://hub.docker.com/v2/users/login | jq -r .token)
          curl -fsS -H "Authorization: JWT $jwt" \
            "https://hub.docker.com/v2/repositories/$HUB_USER/$HUB_REPO/tags?page_size=100&name=pr" \
          | jq -r --arg a "pr-$PR_NUMBER" --arg b "-pr.$PR_NUMBER." '.results[].name | select(. == $a or contains($b))' \
          | while read -r tag; do
              echo "deleting $tag"
              curl -fsS -X DELETE -H "Authorization: JWT $jwt" \
                "https://hub.docker.com/v2/repositories/$HUB_USER/$HUB_REPO/tags/$tag/"
            done
