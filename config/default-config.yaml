# Default config bundled in the image (spec 5.1). Mounted override: /etc/homematic-exporter/config/config.yaml.
# Contains no secrets and no identifying data, so it may live in git.
#
# Ownership: `extract` and `tuning` are fixed by the contracts task (changing a key needs a spec change);
# the `metrics` list is filled by the `metrics` task.
version: 1
tuning:
  heat_demand_min_position: 0.0     # valve position above this counts as open
  state_retention_days: 90          # battery history records unseen this long are pruned
extract:
  system_room: system               # room for devices not in exactly one room
  room_group_type: HEATING          # groups of this type are rooms; room name = group label
  device_models:                    # raw modelType -> device_type label
    "HmIP-eTRV-B-2 R4M": radiator-thermostat
    "HmIP-STH": temp-humidity-sensor
    "HmIP-STHD": temp-humidity-display
    "HmIP-WTH-1": wall-thermostat
    "HmIP-SWDM-2": door-window-contact
    "HmIP-FALMOT-C12": floor-controller
    "HmIP-FSM": circulation-pump-switch
    "HmIP-HAP JS1": access-point
  rooms:                            # Room attribute: raw group field
    temperature_celsius: actualTemperature
    setpoint_celsius: setPointTemperature
    humidity: humidity
    control_mode: controlMode
    window_state: windowState
  device_flags:                     # Device attribute: raw field on the device base channels
    low_battery: lowBat
    unreachable: unreach
    undervoltage: deviceUndervoltage
    rssi_dbm: rssiDeviceValue
  valves:
    - channel_type: FLOOR_TERMINAL_BLOCK_MECHANIC_CHANNEL
      device_type: floor-valve
      room_from: channel_groups     # room named by the channel's HEATING group; skipped if none
      fields: { position_ratio: valvePosition }
    - channel_type: HEATING_THERMOSTAT_CHANNEL
      device_type: radiator-thermostat
      room_from: device_room
      fields: { position_ratio: valvePosition, actual_temperature_celsius: valveActualTemperature }
  contacts:
    - channel_type: SHUTTER_CONTACT_CHANNEL
      fields: { window_state: windowState }
  extras: []                        # e.g. - { scope: room, key: boost_duration, field: boostDuration }
metrics:                            # spec 6.1-6.4: one entry per exported series family
  # Rooms (label: room)
  - { name: homematic_room_temperature_celsius, help: Room temperature, type: gauge,
      scope: rooms, value: temperature_celsius, labels: [room] }
  - { name: homematic_room_setpoint_celsius, help: Room target temperature, type: gauge,
      scope: rooms, value: setpoint_celsius, labels: [room] }
  - { name: homematic_room_humidity_ratio, help: Room relative humidity (0-1), type: gauge,
      scope: rooms, value: humidity, scale: 0.01, labels: [room] }
  - { name: homematic_room_automatic_mode, help: 1 if the room is in automatic mode, type: gauge,
      scope: rooms, value: control_mode, transform: { equals: AUTOMATIC }, labels: [room] }
  - { name: homematic_room_window_open, help: 1 if the room window is open or tilted, type: gauge,
      scope: rooms, value: window_state, transform: { in: [OPEN, TILTED] }, labels: [room] }
  # Valves and contacts (labels: room, device_type, device)
  - { name: homematic_valve_position_ratio, help: "Valve position (0 closed, 1 fully open)", type: gauge,
      scope: valves, value: position_ratio, labels: [room, device_type, device] }
  - { name: homematic_valve_actual_temperature_celsius, help: Temperature measured at the valve,
      type: gauge, scope: valves, value: actual_temperature_celsius,
      labels: [room, device_type, device] }
  - { name: homematic_contact_open, help: 1 if the door or window contact is open or tilted,
      type: gauge, scope: contacts, value: window_state, transform: { in: [OPEN, TILTED] },
      labels: [room, device_type, device] }
  # Devices (labels: room, device_type, device)
  - { name: homematic_device_low_battery, help: 1 if the device reports a low battery, type: gauge,
      scope: devices, value: low_battery, transform: bool, labels: [room, device_type, device] }
  - { name: homematic_device_unreachable, help: 1 if the device is unreachable, type: gauge,
      scope: devices, value: unreachable, transform: bool, labels: [room, device_type, device] }
  - { name: homematic_device_undervoltage, help: 1 if the device reports undervoltage, type: gauge,
      scope: devices, value: undervoltage, transform: bool, labels: [room, device_type, device] }
  - { name: homematic_device_rssi_dbm, help: Radio signal strength in dBm, type: gauge,
      scope: devices, value: rssi_dbm, labels: [room, device_type, device] }
  # Battery history (labels: room, device_type, device); kept by the state module
  - { name: homematic_device_battery_low_since_timestamp_seconds,
      help: Unix time the battery was first seen low (approximate on first sight), type: gauge,
      scope: batteries, value: low_since, labels: [room, device_type, device] }
  - { name: homematic_device_battery_last_replaced_timestamp_seconds,
      help: Unix time the battery was last seen going from low to ok, type: gauge,
      scope: batteries, value: last_replaced, labels: [room, device_type, device] }
